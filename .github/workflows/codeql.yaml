name: "CodeQL Advanced"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    # Weekly baseline re-scan, Thursdays 18:16 UTC (off-peak, avoids the
    # top-of-hour rush so scheduled runs are not queued behind everyone else's)
    - cron: '16 18 * * 4'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Cancel superseded PR runs, but let main/scheduled scans finish - a cancelled
  # analyze uploads no SARIF, which leaves the code scanning baseline stale.
  # Note both push-on-main and schedule share one group (pull_request is null
  # and github.ref is refs/heads/main for both), so they serialize, not cancel.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write
      contents: read
      # Required by codeql-action/analyze to enumerate workflow runs if this
      # repository is ever made private
      actions: read

    strategy:
      fail-fast: false
      matrix:
        include:
          # Workflow files are parsed, not compiled, so no build is needed
          - language: actions
            build-mode: none
          # Go needs a real compile for CodeQL to extract the database
          - language: go
            build-mode: autobuild

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          check-latest: true
          go-version-file: '.go-version'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: "/language:${{ matrix.language }}"
