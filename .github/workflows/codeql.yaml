name: "CodeQL Advanced"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly baseline re-scan, Thursdays 18:16 UTC (off-peak, avoids the
    # top-of-hour rush so scheduled runs are not queued behind everyone else's)
    - cron: '16 18 * * 4'

concurrency:
  # Pushes group per commit so every main commit gets its codeql-scan attestation
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.sha) || github.ref }}
  # Cancel superseded PR runs, but let main/scheduled scans finish - a cancelled
  # analyze uploads no SARIF, which leaves the code scanning baseline stale.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write
      contents: read
      # Required by codeql-action/analyze to enumerate workflow runs if this
      # repository is ever made private
      actions: read

    strategy:
      fail-fast: false
      matrix:
        include:
          # Workflow files are parsed, not compiled, so no build is needed
          - language: actions
            build-mode: none
          # Go needs a real compile for CodeQL to extract the database
          - language: go
            build-mode: autobuild

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          check-latest: true
          go-version-file: '.go-version'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:${{ matrix.language }}"
          # Keep SARIF for the Kosli attestation
          output: sarif-results

      - name: Upload SARIF for Kosli attestation
        if: github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codeql-sarif-${{ matrix.language }}
          path: sarif-results
          retention-days: 7

  # Uses GitHub alert state, so dismissed false positives don't count.
  # A failed analyze skips this job, leaving codeql-scan missing (non-compliant).
  attest:
    name: Attest CodeQL to Kosli
    if: github.event_name == 'push'
    needs: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: read

    env:
      GIT_COMMIT: ${{ github.sha }}
      KOSLI_API_TOKEN: ${{ secrets.KOSLI_API_TOKEN }}
      KOSLI_FLOW_NAME: ${{ github.event.repository.name }}
      KOSLI_ORG: ${{ vars.KOSLI_ORG }}

    steps:
      - name: Setup Kosli CLI
        uses: kosli-dev/setup-cli-action@15b43acd0374a4b5311978d7ea59269edd131dfc # v5.2.2
        with:
          version: latest

      - name: Download SARIF results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: codeql-sarif-*
          path: sarif-results
          merge-multiple: true

      # The trail is created by the Main Pipeline, which runs in parallel
      - name: Wait for Kosli trail
        run: |
          for _ in $(seq 1 30); do
            if out=$(kosli get trail "${GIT_COMMIT}" --flow "${KOSLI_FLOW_NAME}" 2>&1); then
              exit 0
            fi
            sleep 10
          done
          # A bad token or org fails like a missing trail, so show the error
          echo "${out}"
          echo "::error::Kosli trail ${GIT_COMMIT} not found in flow ${KOSLI_FLOW_NAME} after 5 minutes"
          exit 1

      - name: Count open high/critical CodeQL alerts
        id: alerts
        env:
          GH_TOKEN: ${{ github.token }}
        # Counts open alerts on main (latest analysis), not strictly this commit's.
        # Capture first so an API failure can't read as zero alerts.
        run: |
          alerts=$(gh api --paginate \
            "repos/${{ github.repository }}/code-scanning/alerts?ref=${{ github.ref }}&state=open&tool_name=CodeQL&per_page=100" \
            --jq '.[] | select(.rule.security_severity_level == "high" or .rule.security_severity_level == "critical") | .number')
          count=$(printf '%s' "${alerts}" | grep -c . || true)
          echo "Open high/critical CodeQL alerts: ${count}"
          echo "count=${count}" >> "$GITHUB_OUTPUT"

      - name: Attest CodeQL scan
        run: |
          kosli attest generic \
            --flow ${KOSLI_FLOW_NAME} \
            --trail ${GIT_COMMIT} \
            --name codeql-scan \
            --compliant=${{ steps.alerts.outputs.count == '0' }} \
            --attachments sarif-results \
            --description "CodeQL security-extended (Go, Actions); open high/critical alerts on main at attestation time: ${{ steps.alerts.outputs.count }}"

      - name: Fail on open CodeQL alerts
        if: steps.alerts.outputs.count != '0'
        run: |
          echo "::error::${{ steps.alerts.outputs.count }} open high/critical CodeQL alert(s) on main; fix or dismiss them in Security > Code scanning"
          exit 1
