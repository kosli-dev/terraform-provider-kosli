name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  notify-start:
    runs-on: ubuntu-latest
    steps:
      - uses: kosli-dev/reusable-actions/slack-release-notify@f739efd12323329b5656fbbda9d843a836ace5ff # main
        with:
          slack-bot-token: ${{ secrets.SLACK_BOT_TOKEN }}
          slack-channel-id: ${{ vars.SLACK_CHANNEL_ID }}
          stage: start

  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          check-latest: true
          go-version-file: '.go-version'

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        id: import_gpg
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: '~> v2' # current latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}

      # The CHANGELOG.md entry/PR is generated by .github/workflows/changelog.yaml,
      # which runs after this workflow completes (claude-code-action does not
      # support tag-push events, so it cannot run in this workflow).

  notify-finish:
    needs: [notify-start, release]
    if: always() && needs.notify-start.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read     # ← needed to fetch run_started_at for duration
      contents: read    # ← needed to read release notes via `gh release view`
    steps:
      - name: Determine status
        id: status
        run: |
          if [[ "${{ !contains(join(needs.*.result, ','), 'failure') && !contains(join(needs.*.result, ','), 'cancelled') }}" == "true" ]]; then
            echo "value=success" >> "$GITHUB_OUTPUT"
          else
            echo "value=failure" >> "$GITHUB_OUTPUT"
          fi

      - uses: kosli-dev/reusable-actions/slack-release-notify@f739efd12323329b5656fbbda9d843a836ace5ff # main
        with:
          slack-bot-token: ${{ secrets.SLACK_BOT_TOKEN }}
          slack-channel-id: ${{ vars.SLACK_CHANNEL_ID }}
          stage: finish
          status: ${{ steps.status.outputs.value }}
