name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  notify-start:
    runs-on: ubuntu-latest
    steps:
      - uses: kosli-dev/reusable-actions/slack-release-notify@f739efd12323329b5656fbbda9d843a836ace5ff # main
        with:
          slack-bot-token: ${{ secrets.SLACK_BOT_TOKEN }}
          slack-channel-id: ${{ vars.SLACK_CHANNEL_ID }}
          stage: start

  # Gate: the tagged commit's trail must be compliant. GoReleaser rebuilds the
  # binaries, so assert the one main attested (fingerprint read from the trail).
  compliance:
    name: Kosli compliance gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      ARTIFACT_NAME: ${{ github.event.repository.name }}
      KOSLI_API_TOKEN: ${{ secrets.KOSLI_API_TOKEN }}
      KOSLI_FLOW_NAME: ${{ github.event.repository.name }}
      KOSLI_ORG: ${{ vars.KOSLI_ORG }}
      KOSLI_VERSION: 'latest'
    steps:
      - name: Setup Kosli CLI
        uses: kosli-dev/setup-cli-action@15b43acd0374a4b5311978d7ea59269edd131dfc # v5.2.2
        with:
          version: ${{ env.KOSLI_VERSION }}

      # Capture first so a missing trail or API error fails the step
      - name: Find attested artifact
        id: artifact
        run: |
          trail=$(kosli get trail "${GITHUB_SHA}" --flow "${KOSLI_FLOW_NAME}" --output json)
          fingerprint=$(jq -r --arg a "${ARTIFACT_NAME}" \
            '.compliance_status.artifacts_statuses[$a].artifact_fingerprint // empty' <<< "${trail}")
          if [ -z "${fingerprint}" ]; then
            jq '.compliance_status' <<< "${trail}"
            echo "::error::No attested ${ARTIFACT_NAME} binary on Kosli trail ${GITHUB_SHA}; tag only after the Main Pipeline has built it"
            exit 1
          fi
          echo "Artifact fingerprint: ${fingerprint}"
          echo "fingerprint=${fingerprint}" >> "$GITHUB_OUTPUT"
          echo "trail-compliant=$(jq -r '.compliance_status.is_compliant' <<< "${trail}")" >> "$GITHUB_OUTPUT"

      - name: Assert trail compliance
        env:
          FINGERPRINT: ${{ steps.artifact.outputs.fingerprint }}
        run: |
          kosli assert artifact \
            --fingerprint "${FINGERPRINT}" \
            --flow "${KOSLI_FLOW_NAME}"

      # assert artifact matches by fingerprint across the flow; this pins the verdict to this trail
      - name: Check trail is compliant
        if: steps.artifact.outputs.trail-compliant != 'true'
        run: |
          echo "::error::Kosli trail ${GITHUB_SHA} is not compliant"
          exit 1

  release:
    name: Release
    needs: compliance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          check-latest: true
          go-version-file: '.go-version'

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        id: import_gpg
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: '~> v2' # current latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}

      # The CHANGELOG.md entry/PR is generated by .github/workflows/changelog.yaml,
      # which runs after this workflow completes (claude-code-action does not
      # support tag-push events, so it cannot run in this workflow).

  notify-finish:
    # A failed gate skips release, which would otherwise report success
    needs: [notify-start, compliance, release]
    if: always() && needs.notify-start.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read     # ← needed to fetch run_started_at for duration
      contents: read    # ← needed to read release notes via `gh release view`
    steps:
      - name: Determine status
        id: status
        run: |
          if [[ "${{ !contains(join(needs.*.result, ','), 'failure') && !contains(join(needs.*.result, ','), 'cancelled') }}" == "true" ]]; then
            echo "value=success" >> "$GITHUB_OUTPUT"
          else
            echo "value=failure" >> "$GITHUB_OUTPUT"
          fi

      - uses: kosli-dev/reusable-actions/slack-release-notify@f739efd12323329b5656fbbda9d843a836ace5ff # main
        with:
          slack-bot-token: ${{ secrets.SLACK_BOT_TOKEN }}
          slack-channel-id: ${{ vars.SLACK_CHANNEL_ID }}
          stage: finish
          status: ${{ steps.status.outputs.value }}
