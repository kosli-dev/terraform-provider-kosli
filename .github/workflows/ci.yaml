name: CI - Pull Request Checks

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '.github/'
      - 'LICENSE'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  KOSLI_API_TOKEN: ${{ secrets.KOSLI_API_TOKEN }}
  KOSLI_ORG: ${{ vars.KOSLI_ORG }}
  TRIVY_VERSION: 'v0.75.0'

permissions:
  contents: read

jobs:
  # Quality checks on PR branch
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          check-latest: true
          go-version-file: '.go-version'

      - name: Verify Go version
        run: go version

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "~1.14.0"
          terraform_wrapper: false

      - name: Check code formatting
        run: |
          make fmt
          if [ -n "$(git status --porcelain)" ]; then
            echo "Code is not formatted. Run 'make fmt' locally."
            git diff
            exit 1
          fi

      - name: Check documentation is up-to-date
        run: |
          go install github.com/hashicorp/terraform-plugin-docs/cmd/tfplugindocs@v0.24.0
          make docs
          if [ -n "$(git status --porcelain)" ]; then
            echo "Documentation is out of date. Run 'make docs' locally."
            git diff
            exit 1
          fi

      - name: Run go vet
        run: make vet

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: latest
          args: --timeout=5m

      - name: Run tests with coverage
        run: make test

      - name: Run acceptance tests
        run: make testacc

  # Trivy scan (dependencies, secrets, IaC misconfig) - informational on PRs,
  # findings surface in GitHub code scanning instead of failing the check
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Pinned by SHA with an explicit Trivy version: aquasecurity action tags
      # were hijacked in the March 2026 supply-chain incident
      - name: Setup Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: ${{ env.TRIVY_VERSION }}

      - name: Run Trivy scan
        run: |
          trivy fs . \
            --scanners vuln,secret,misconfig \
            --severity HIGH,CRITICAL \
            --format json \
            --output trivy-results.json \
            --exit-code 0
          trivy convert --format sarif --output trivy-results.sarif trivy-results.json
          trivy convert --format table trivy-results.json

      - name: Upload Trivy results to code scanning
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy-results.sarif
          category: trivy

  # Build verification (but don't attest to Kosli)
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          check-latest: true
          go-version-file: '.go-version'

      - name: Build provider
        run: make build

      - name: Upload provider binary for validation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: terraform-provider-kosli
          path: terraform-provider-kosli
          retention-days: 1

  # Validate examples
  validate-examples:
    name: Validate ${{ matrix.example }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    strategy:
      fail-fast: false
      matrix:
        example:
          - examples/resources/kosli_action
          - examples/resources/kosli_control
          - examples/resources/kosli_custom_attestation_type
          - examples/resources/kosli_environment
          - examples/resources/kosli_flow
          - examples/resources/kosli_logical_environment
          - examples/resources/kosli_notification_config
          - examples/resources/kosli_policy
          - examples/resources/kosli_policy_attachment
          - examples/resources/kosli_service_account
          - examples/resources/kosli_service_account_api_key
          - examples/data-sources/kosli_action
          - examples/data-sources/kosli_control
          - examples/data-sources/kosli_custom_attestation_type
          - examples/data-sources/kosli_environment
          - examples/data-sources/kosli_flow
          - examples/data-sources/kosli_logical_environment
          - examples/data-sources/kosli_notification_config
          - examples/data-sources/kosli_policy
          - examples/data-sources/kosli_service_account
          - examples/data-sources/kosli_service_account_api_keys
          - examples/list-resources/kosli_control

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          check-latest: true
          go-version-file: '.go-version'

      - name: Download provider binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: terraform-provider-kosli

      - name: Make binary executable
        run: chmod +x terraform-provider-kosli

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "~1.14.0"
          terraform_wrapper: false

      - name: Install provider
        run: make install

      - name: Configure Terraform dev override
        run: |
          OS_ARCH="$(go env GOOS)_$(go env GOARCH)"
          INSTALL_DIR="$HOME/.terraform.d/plugins/registry.terraform.io/kosli-dev/kosli/dev/$OS_ARCH"

          cat > "$HOME/.terraformrc" <<EOF
          provider_installation {
            dev_overrides {
              "registry.terraform.io/kosli-dev/kosli" = "$INSTALL_DIR"
            }
            direct {}
          }
          EOF

      - name: Validate example
        run: |
          echo "Validating ${{ matrix.example }}..."
          cd "${{ matrix.example }}"
          terraform init -backend=false
          terraform validate -query
          echo "✓ ${{ matrix.example }} validated successfully"
